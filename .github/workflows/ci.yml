name: CI

on:
  push:
    branches: [main, lite]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install numpy==2.5.3 rapidfuzz==3.14.6 pytest
      - name: Unit tests
        run: python -m pytest -q

  native:
    # the global hotkey DLL that the Windows app bundles, built with MSVC as the release does, plus its tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tiro_hook.dll and run the hotkey tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\build_native.ps1
