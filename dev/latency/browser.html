<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TIRO-TEST-BROWSER 0</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 24px; background: #f4f4f4; }
  textarea { width: 90vw; height: 60vh; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<p>Tiro latency test: this box receives dictated text. Do not type here.</p>
<textarea id="t" autofocus></textarea>
<script>
  const t = document.getElementById("t");
  // After a change is painted (next animation frame), tell the test harness the newest length. At most one
  // report is in flight, so a long dictation never builds up a queue of stale reports.
  let sent = -1, inflight = false;
  function report() {
    const n = t.value.length;
    if (inflight || n === sent) return;
    inflight = true;
    sent = n;
    fetch("/len?n=" + n, {cache: "no-store"}).catch(() => {}).finally(() => { inflight = false; report(); });
  }
  t.addEventListener("input", () => {
    document.title = "TIRO-TEST-BROWSER " + t.value.length;
    requestAnimationFrame(() => setTimeout(report, 0));
  });
  window.addEventListener("focus", () => t.focus());
</script>
</body>
</html>
